  /* Master dispatcher */
  function posterHTML() {
    const v = state.variant;
    // Lineup is too dense for 4:5 → force story format for this variant only
    let savedFormat = null;
    if (v === 'lineup' && state.format === 'post') {
      savedFormat = state.format;
      state.format = 'story';
    }
    let inner, opts = {};
    if (v === 'matchday') inner = classicPoster();
    else if (v === 'lineup') inner = lineupPoster();
    else if (v === 'kickoff') inner = kickoffPoster();
    else if (v === 'live-score') inner = liveScorePoster();
    else if (v === 'goal') inner = goalPoster();
    else if (v === 'halftime') inner = halftimePoster();
    else if (v === 'recap') inner = recapPoster();
    if (inner && typeof inner === 'object') { opts.fullBleed = !!inner.fullBleed; inner = inner.html; }
    const html = shellWrap(inner, opts);
    if (savedFormat) state.format = savedFormat;  // restore for caller
    return html;
  }

  /* ==================================================================
     UI RENDERING — panels, tabs, events
     ================================================================== */

  function updatePreview() {
    const container = document.getElementById('poster-root');
    const wrap = container.closest('.preview-inner');
    const ratio = container.closest('.preview-ratio');
    // Lineup variant always renders as story regardless of toggle
    const effectiveFormat = (state.variant === 'lineup') ? 'story' : state.format;
    if (effectiveFormat === 'post') {
      ratio.classList.add('fmt-post');
    } else {
      ratio.classList.remove('fmt-post');
    }
    const wrapW = wrap.clientWidth;
    const f = FORMATS[effectiveFormat];
    const scale = wrapW / f.w;
    container.innerHTML = posterHTML();
    container.style.transform = `scale(${scale})`;
    container.style.width = f.w + 'px';
    container.style.height = f.h + 'px';
  }
  function updateAppbar() {
    const clubEl = document.getElementById('appbar-club-name');
    if (clubEl && clubEl.textContent !== TENANT_CONFIG.club.name) clubEl.textContent = TENANT_CONFIG.club.name;
    document.getElementById('match-opp').textContent = 'vs ' + getOpp().name;
    const capDay = state.kickoff.dayName.charAt(0) + state.kickoff.dayName.slice(1).toLowerCase();
    document.getElementById('match-date').textContent = `${capDay.slice(0,3)} ${state.kickoff.dateLabel.toLowerCase()} · ${isTimeTbd() ? '–:–' : state.kickoff.time}`;
  }

  function sectionsForVariant() {
    const v = state.variant;
    let extra = [];
    if (v === 'lineup' || v === 'kickoff') extra = ['lineup'];
    else if (v === 'goal') extra = ['goal','score'];
    else if (v === 'recap') extra = ['score','goal'];          // recap can edit goal timeline
    else if (['live-score','halftime'].includes(v)) extra = ['score','goal'];
    // Insert extras before customize — dom/ext + lieu viennent toujours du match sélectionné
    return ['variant','match', ...extra, 'customize','caption'];
  }
  const SECTION_LABELS = {
    variant:'Variant', match:'Match', lineup:'Compo',
    goal:'Buts ⚽', score:'Score',
    customize:'Personnaliser', caption:'Caption'
  };
  function renderSectionTabs() {
    const tabs = sectionsForVariant();
    if (!tabs.includes(state.activeSection)) state.activeSection = tabs[0];
    const el = document.getElementById('section-tabs');
    el.innerHTML = tabs.map(t => `<div class="tab ${state.activeSection===t?'on':''}" data-s="${t}">${SECTION_LABELS[t]}</div>`).join('');
    el.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      state.activeSection = b.dataset.s;
      renderAll();
    }));
  }

  function renderPanel() {
    const el = document.getElementById('panel-content');
    const s = state.activeSection;
    if (s === 'variant') el.innerHTML = panelVariant();
    else if (s === 'match') el.innerHTML = panelMatch();
    else if (s === 'lineup') el.innerHTML = panelLineup();
    else if (s === 'goal') el.innerHTML = panelGoal();
    else if (s === 'score') el.innerHTML = panelScore();
    else if (s === 'customize') el.innerHTML = panelCustomize();
    else if (s === 'caption') el.innerHTML = panelCaption();
    bindPanelEvents();
  }

  function panelVariant() {
    return `<div class="panel">
      <div class="panel-label">Type de publication</div>
      <div class="variant-grid">
        ${VARIANTS.map(v => `<div class="variant-card ${state.variant===v.id?'on '+v.theme:''}" data-v="${v.id}">
          <div class="ico">${v.icon}</div>
          <div class="lbl">${v.label}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }
  /* ---- MATCH BROWSER (calendrier 26/27 — auto-config, zéro saisie) ---- */
  const MONTH_ABBR = { JANVIER:'JANV', FÉVRIER:'FÉV', MARS:'MARS', AVRIL:'AVR', MAI:'MAI', JUIN:'JUIN',
    JUILLET:'JUIL', AOÛT:'AOÛT', SEPTEMBRE:'SEPT', OCTOBRE:'OCT', NOVEMBRE:'NOV', DÉCEMBRE:'DÉC' };
  const MONTH_INDEX = { JANVIER:0, FÉVRIER:1, MARS:2, AVRIL:3, MAI:4, JUIN:5,
    JUILLET:6, AOÛT:7, SEPTEMBRE:8, OCTOBRE:9, NOVEMBRE:10, DÉCEMBRE:11 };
  function matchDate(m) {
    /* Les fixtures projetés du bundle portent l'ISO exact — le parse du
       dateLabel FR ne sert plus que de secours pour les fixtures hardcodés. */
    if (m.kickoff.iso) return new Date(m.kickoff.iso);
    const parts = (m.kickoff.dateLabel || '').split(' ');
    const day = parseInt(parts[0], 10) || 1;
    const mo = MONTH_INDEX[parts[1]] != null ? MONTH_INDEX[parts[1]] : 0;
    const hm = (m.kickoff.time || '12:00').split(':');
    return new Date(m.kickoff.year, mo, day, parseInt(hm[0], 10) || 12, parseInt(hm[1], 10) || 0);
  }
  /* Prochain match par date réelle — un match reste « courant » ~3h après le
     coup d'envoi (recap post-match). Fallback : dernier match de la saison. */
  function nextUpcomingMatch() {
    const cutoff = Date.now() - 3 * 3600 * 1000;
    const upcoming = MATCHES
      .filter(m => matchDate(m).getTime() >= cutoff)
      .sort((a, b) => matchDate(a) - matchDate(b));
    return upcoming[0] || MATCHES[MATCHES.length - 1];
  }
  // Applique TOUS les champs d'un match du calendrier au state (sans re-render).
  // Ballons de match : JAMAIS hérités du match précédent — re-saisis par match.
  function applyMatchFields(m) {
    state.matchId = m.id;
    state.opponentSlug = m.opponentSlug;
    state.homeAway = m.homeAway;
    state.competition = m.comp;      // valeurs identiques à state.competition
    // Sous-label porté par le fixture (chaque tour de coupe embarque le sien) ;
    // sinon défaut par compétition.
    state.competitionSub = m.competitionSub
      || (m.comp === 'coupe' ? 'COUPE DES ACTIFS' : m.comp === 'amical' ? 'PRÉ-SAISON' : '');
    state.matchNumber = m.matchNumber;
    state.venue = m.venue;
    state.venueCity = m.venueCity;
    state.kickoff = { ...m.kickoff };
    /* Parrains ballon publiés sur le site pour CE match (éditables ensuite) ;
       jamais hérités du match précédent. */
    state.matchBallSponsors = ballSponsorsFor(m.id);
    state.convokedPlayers = convocationFor(m.id);
  }
  function applyMatch(id) {
    const m = MATCHES.find(x => x.id === id);
    if (!m) return;
    const changing = id !== state.matchId;
    if (changing && state.goals.length > 0 &&
        !confirm('Changer de match efface le score et les buts en cours. Continuer ?')) return;
    applyMatchFields(m);
    if (changing) {
      resetLiveFields();
      /* Retour sur un match déjà entamé (< 12 h) → on reprend son état. */
      const snap = readSnap(LIVE_KEY_PREFIX + id);
      if (snap) applySnap(snap);
    }
    state._userPickedMatch = true;   // un refresh bundle tardif ne doit plus écraser
    matchBrowserComp = null;         // le browser suit le match appliqué
    ensureCrest(getOpp());
    renderAll();
  }
  window.applyMatch = applyMatch;
  /* Segmented control du browser — filtre d'affichage UNIQUEMENT : ne touche
     pas au poster tant qu'aucun match n'est choisi dans la liste. */
  let matchBrowserComp = null;       // null → suit la compétition du match appliqué
  window.setMatchBrowser = function(comp) {

    renderPanel();

      const parts = (m.kickoff.dateLabel || '').split(' ');
      const dateShort = parts.length === 2 ? `${parts[0]} ${MONTH_ABBR[parts[1]] || parts[1]}` : m.kickoff.dateLabel;
      const isHome = m.homeAway === 'home';
      return `<button class="match-row ${state.matchId === m.id ? 'on' : ''}" data-mid="${m.id}" type="button">
        <span class="mr-tag">${m.label}</span>

        <span class="mr-opp">${oppName}</span>
        <span class="mr-ha ${isHome ? 'dom' : 'ext'}">${isHome ? 'DOM' : 'EXT'}</span>
        <span class="mr-time">${m.timeProvisional
          ? '<span style="color:#F5B82E;">–:– ★</span>'
          : m.kickoff.time}</span>

  }
  function panelScore() {
    const isLive = ['live-score','goal','halftime','kickoff'].includes(state.variant);
    return `<div class="panel">
      <div class="panel-label">Score <span class="b">${isLive ? 'En cours' : 'Final'}</span></div>
      <div class="score-row">
        <div class="score-group">
          <label>${TENANT_CONFIG.club.name}</label>
          <input type="number" id="score-home" min="0" max="30" value="${state.score.home}" inputmode="numeric">

        <span class="score-dash">—</span>
        <div class="score-group">

  function panelGoal() {

      ${state.scorerSide === 'home' ? `

        <div class="player-grid" id="scorer-grid">
          ${allPlayers().map(p => `<div class="player-mini ${state.scorerId===p.id?'on':''}${p.isGuest?' is-guest':''}" data-id="${p.id}">
            ${p.isGuest ? '<div class="pguest-tag">INVITÉ</div>' : ''}
            <div class="pimg-wrap">
              ${p.photoUrl ? `<img src="${p.photoUrl}" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.pinit').style.display='flex'">` : ''}
              <div class="pinit" style="${p.photoUrl?'display:none':''}">${playerInitials(p)}</div>

          <div style="font-size:12px; color:rgba(255,255,255,0.75); margin-bottom:10px; line-height:1.4;">Tape pour enregistrer un but encaissé à la minute <b>${state.minute || 0}'</b>.</div>
          <button onclick="logAwayGoal()" style="width:100%; padding:12px; border-radius:10px; border:0; background:#EF4444; color:#fff; font-family:'Inter',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer;">+ But adverse à la ${state.minute || 0}'</button>
        </div>
      `}
      <div class="panel-label" style="margin-top:16px;">Buts du match <span class="b ${state.goals.length>0?'green':''}">${state.goals.length}</span>
        ${state.goals.length > 0 ? `<button onclick="undoGoal()" style="background:rgba(46,123,255,0.15); color:#2E7BFF; border:1px solid rgba(46,123,255,0.4); padding:4px 10px; border-radius:999px; font-family:'Inter',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;">↩ Annuler dernier</button>` : ''}
      </div>
      <div class="goal-list">${goalsHtml}</div>
    </div>`;
  }
  function parseFormationCounts(f) {
    const parts = (f || '4-3-3').split('-').map(n => parseInt(n, 10) || 0);
    return {
      G: 1,
      DEF: parts[0] || 0,
      MIL: parts.slice(1, -1).reduce((a,b) => a+b, 0),
      AT: parts[parts.length - 1] || 0,
    };
  }
  function countStartersByPosition(ids) {
    const c = { G:0, DEF:0, MIL:0, AT:0 };
    ids.forEach(id => { const p = BY_ID[id]; if (p && c[p.position] != null) c[p.position]++; });
    return c;
  }
  function posPill(label, have, need) {
    const ok = have === need;
    const tooMany = have > need;
    const fg = ok ? '#22C55E' : (tooMany ? '#EF4444' : '#F59E0B');
    const bg = ok ? 'rgba(34,197,94,0.14)' : (tooMany ? 'rgba(239,68,68,0.18)' : 'rgba(245,158,11,0.14)');
    const bd = ok ? 'rgba(34,197,94,0.45)' : (tooMany ? 'rgba(239,68,68,0.55)' : 'rgba(245,158,11,0.45)');
    return `<span style="display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:6px; background:${bg}; border:1px solid ${bd}; color:${fg}; font-family:'Inter'; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; line-height:1;">${label} ${have}/${need}</span>`;
  }
  /* panelLineup — INTERACTIVE PITCH MODE
     - 11 numbered slots positioned by formation (G top → AT bottom).
     - Empty slot = blue dashed circle with "+" → tap opens player picker.
     - Filled slot = mini player card → tap opens action sheet (replace/remove/cap).
     - Bench = compact grid of unplaced players below. */
  function panelLineup() {
    const totalSlots = state.lineupStarters.length;
    const filled = state.lineupStarters.filter(id => id).length;
    const sKlass = filled === 11 ? 'ok' : '';
    const bCount = state.lineupBench.length;
    const bKlass = bCount >= 5 ? 'ok' : '';
    const slotPositions = buildSlotPositions(state.formation);
    const rows = FORMATION_ROWS[state.formation] || FORMATION_ROWS['4-3-3'];

    // Compute pitch coordinates per slot — same math as lineupPoster (G top, AT bottom)
    const N = rows.length;
    const yTop = 10, yBottom = 90;
    const yPositions = [];
    for (let i = 0; i < N; i++) {
      yPositions.push(yTop + (yBottom - yTop) * (i / Math.max(1, N - 1)));
    }
    let slotsHtml = '';
    let cursor = 0;
    for (let r = 0; r < rows.length; r++) {
      const n = rows[r];
      const y = yPositions[r];
      const margin = n === 1 ? 0 : (n <= 3 ? 18 : (n === 4 ? 12 : 8));
      for (let c = 0; c < n; c++) {
        const x = n === 1 ? 50 : margin + (100 - 2 * margin) * (c / (n - 1));
        const slotIdx = cursor + c;
        const playerId = state.lineupStarters[slotIdx];
        const p = playerId ? BY_ID[playerId] : null;
        const isCaptain = p && p.id === state.captainId;
        const photoUrl = p && p.photoUrl ? p.photoUrl : '';
        if (p) {
          slotsHtml += `
            <div class="pitch-slot filled ${isCaptain?'is-captain':''}" data-slot="${slotIdx}" style="left:${x}%; top:${y}%;">
              <div class="slot-circle">
                ${photoUrl ? `<img src="${photoUrl}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                <div class="pinit" style="${photoUrl?'display:none':''}">${playerInitials(p)}</div>
                <div class="slot-jersey">${p.jerseyDisplay}</div>
                ${isCaptain ? '<div class="slot-cap">C</div>' : ''}
              </div>
              <div class="slot-name">${p.lastName}</div>
            </div>`;
        } else {
          slotsHtml += `
            <div class="pitch-slot empty" data-slot="${slotIdx}" data-pos="${slotPositions[slotIdx]}" style="left:${x}%; top:${y}%;">
              <div class="slot-circle">+</div>
              <div class="slot-pos">${slotPositions[slotIdx]}</div>
            </div>`;
        }
      }
      cursor += n;
    }

    // Unplaced players for bench — inclut les invités
    const placed = new Set(state.lineupStarters.filter(Boolean));
    const benchCandidates = allPlayers().filter(p => !placed.has(p.id));

    return `<div class="panel">
      <div class="panel-label">Formation <span class="lineup-counter ${sKlass}">${filled}/11 placés</span></div>
      <div class="row" style="margin-top:0;">
        <select id="formation-select" style="flex:1;">
          ${['4-3-3','4-4-2','4-2-3-1','3-5-2','5-3-2','3-4-3'].map(f => `<option value="${f}" ${state.formation===f?'selected':''}>${f}</option>`).join('')}
        </select>
        <button onclick="resetLineup()" style="background:rgba(239,68,68,0.15); color:#EF4444; border:1px solid rgba(239,68,68,0.4); padding:9px 14px; border-radius:10px; font-family:'Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;">↺ Vider</button>
      </div>
      <div class="pitch-board" id="pitch-board">
        <svg class="pitch-lines" viewBox="0 0 100 120" preserveAspectRatio="none">
          <rect x="0.5" y="0.5" width="99" height="119"/>
          <line x1="0.5" y1="60" x2="99.5" y2="60"/>
          <circle cx="50" cy="60" r="9"/>
          <circle cx="50" cy="60" r="0.7" fill="rgba(46,123,255,0.55)" stroke="none"/>
          <rect x="22" y="0.5" width="56" height="13"/>
          <rect x="36" y="0.5" width="28" height="5"/>
          <path d="M 38 13 A 12 12 0 0 0 62 13"/>
          <rect x="22" y="106.5" width="56" height="13"/>
          <rect x="36" y="114.5" width="28" height="5"/>
          <path d="M 38 106.5 A 12 12 0 0 1 62 106.5"/>
        </svg>
        ${slotsHtml}
      </div>
      <div class="panel-label" style="margin-top:14px;">Banc <span class="lineup-counter ${bKlass}">${bCount}</span></div>
      <div class="player-grid" id="bench-grid">
        ${benchCandidates.map(p => `<div class="player-mini ${state.lineupBench.includes(p.id)?'on':''}${p.isGuest?' is-guest':''}" data-id="${p.id}">
          <div class="pcheck">✓</div>
          ${p.isGuest ? '<div class="pguest-tag">INVITÉ</div>' : ''}
          <div class="pimg-wrap">
            ${p.photoUrl ? `<img src="${p.photoUrl}" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.pinit').style.display='flex'">` : ''}
            <div class="pinit" style="${p.photoUrl?'display:none':''}">${playerInitials(p)}</div>
          </div>
          <div class="pjer">${p.jerseyDisplay}</div>
          <div class="pname">${p.lastName}</div>
        </div>`).join('')}
      </div>
      ${benchCandidates.length === 0 ? '<div style="font-size:11px; color:rgba(255,255,255,0.4); text-align:center; padding:8px; font-style:italic;">Tous les joueurs sont sur le terrain</div>' : ''}

      <!-- JOUEURS INVITÉS — groupements / prêts d'autres équipes seniors -->
      <div class="panel-label" style="margin-top:18px;">Joueurs invités <span class="b">${state.guests.length}</span></div>
      ${state.guests.length > 0 ? `
        <div class="guest-list">
          ${state.guests.map(g => `
            <div class="guest-row">
              <span class="guest-pos">${g.position}</span>
              <span class="guest-jer">#${g.jerseyDisplay}</span>
              <span class="guest-name">${g.firstName ? g.firstName + ' ' : ''}${g.lastName}</span>
              <button class="guest-rm" onclick="removeGuest('${g.id}')" aria-label="Retirer ${g.lastName}">×</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="guest-form">
        <div class="guest-form-row">
          <input type="text" id="guest-first" placeholder="Prénom" autocomplete="off">
          <input type="text" id="guest-last" placeholder="Nom *" autocomplete="off">
        </div>
        <div class="guest-form-row">
          <input type="number" id="guest-jersey" placeholder="N° *" min="1" max="99" inputmode="numeric" style="flex:0 0 70px;">
          <select id="guest-pos" style="flex:1;">
            <option value="G">G — Gardien</option>
            <option value="DEF">DEF — Défenseur</option>
            <option value="MIL" selected>MIL — Milieu</option>
            <option value="AT">AT — Attaquant</option>
          </select>
          <button class="guest-add-btn" onclick="addGuestFromForm()">+ Ajouter</button>
        </div>
        <small>Pour les joueurs convoqués hors effectif (groupement, équipe sénior d'un autre club).</small>
      </div>
    </div>`;
  }
  function panelCustomize() {
    const msg = state.customMessage[state.variant] || '';
    return `<div class="panel">
      <div class="panel-label">Message personnalisé sur la carte <span class="b">Optionnel</span></div>
      <div class="custom-msg-field">
        <textarea id="custom-msg-input" placeholder="Ex: Soirée à thème, match décisif, retour du capitaine...">${msg}</textarea>
        <small>Apparaîtra en petit sur la carte ${getVariant().label.toLowerCase()}. Laisse vide pour ne rien afficher.</small>
      </div>
    </div>`;
  }
  function panelCaption() {
    const c = getCaption();
    return `<div class="panel">
      <div class="panel-label">Caption du post <span class="b green">Éditable</span></div>
      <div class="caption-field">
        <label>Titre / accroche <button class="reset-btn" onclick="resetCaptionField('hook')">↺ reset</button></label>
        <textarea class="hook" id="cap-hook" rows="2">${c.hook}</textarea>
      </div>
      <div class="caption-field">
        <label>Message principal <button class="reset-btn" onclick="resetCaptionField('body')">↺ reset</button></label>
        <textarea class="body" id="cap-body" rows="5">${c.body}</textarea>
      </div>
      <div class="caption-field">
        <label>Hashtags <button class="reset-btn" onclick="resetCaptionField('tags')">↺ reset</button></label>
        <textarea class="tags" id="cap-tags" rows="2">${c.tags}</textarea>
      </div>
    </div>`;
  }

  function bindPanelEvents() {
    document.querySelectorAll('.variant-card').forEach(c => c.addEventListener('click', () => {
      state.variant = c.dataset.v;
      const vid = c.dataset.v;
      if (vid === 'goal') state.activeSection = 'goal';
      else if (vid === 'lineup' || vid === 'kickoff') state.activeSection = 'lineup';
      else if (['live-score','halftime','recap'].includes(vid)) state.activeSection = 'score';
      renderAll();
    }));
    // Match browser — tap = tout est configuré (même garde _userPickedMatch que l'ancien picker)
    document.querySelectorAll('.match-row').forEach(b => b.addEventListener('click', () => applyMatch(b.dataset.mid)));
    // Heure — SEUL champ éditable du match. L'éditer pose la garde pour qu'un
    // refresh bundle tardif ne réécrase pas l'horaire choisi par le président.
    const tInput = document.getElementById('time-input');
    if (tInput) tInput.addEventListener('input', e => {
      state.kickoff.time = e.target.value;
      /* le président fixe l'heure à la main → elle n'est plus « à confirmer » */
      if (/^\d{1,2}:\d{2}$/.test(e.target.value.trim())) state.kickoff.timeTbd = false;
      state._userPickedMatch = true;
      refresh();
    });
    const sh = document.getElementById('score-home');
    const sa = document.getElementById('score-away');
    const mn = document.getElementById('minute-input');
    if (sh) sh.addEventListener('input', e => { setScoreCount('home', parseInt(e.target.value)||0); refresh(); });
    if (sa) sa.addEventListener('input', e => { setScoreCount('away', parseInt(e.target.value)||0); refresh(); });
    if (mn) mn.addEventListener('input', e => { state.minute = parseInt(e.target.value)||0; refresh(); });

    // Scorer click — increment Atlantic score + log goal into timeline
    document.querySelectorAll('#scorer-grid .player-mini').forEach(el => el.addEventListener('click', () => {
      const pid = el.dataset.id;
      state.scorerId = pid;
      state.scorerSide = 'home';
      state.goals.push({ minute: state.minute || 0, playerId: pid, side: 'home', ts: Date.now() });
      syncScoreFromGoals();
      /* un invité peut marquer — il n'est pas dans BY_ID */
      const p = BY_ID[pid] || state.guests.find(g => g.id === pid) || { lastName: '?', jerseyDisplay: '' };
      toast(`⚽ ${state.minute || 0}' · ${p.lastName.toUpperCase()} #${p.jerseyDisplay} · ${state.score.home}—${state.score.away}`);
      renderPanel(); refresh();
    }));
    const fSel = document.getElementById('formation-select');
    if (fSel) fSel.addEventListener('change', e => { state.formation = e.target.value; renderPanel(); refresh(); });

    // PITCH SLOTS — click on a slot opens the player picker sheet
    document.querySelectorAll('#pitch-board .pitch-slot').forEach(el => el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.slot, 10);
      openSlotSheet(idx);
    }));

    // Bench grid (in lineup panel) — toggle add/remove from bench
    document.querySelectorAll('#bench-grid .player-mini').forEach(el => el.addEventListener('click', () => {
      const id = el.dataset.id;
      const idx = state.lineupBench.indexOf(id);
      if (idx >= 0) state.lineupBench.splice(idx, 1);
      else state.lineupBench.push(id);
      renderPanel(); refresh();
    }));

    // Custom message per variant
    const cm = document.getElementById('custom-msg-input');
    if (cm) cm.addEventListener('input', e => {
      const val = e.target.value;
      if (val) state.customMessage[state.variant] = val;
      else delete state.customMessage[state.variant];
      refresh();
    });
    // Caption fields (editable)
    ['hook','body','tags'].forEach(f => {
      const el = document.getElementById('cap-' + f);
      if (el) el.addEventListener('input', e => {
        if (!state.captionOverride[state.variant]) state.captionOverride[state.variant] = {};
        state.captionOverride[state.variant][f] = e.target.value;
      });
    });
  }

  /* ---------- BOTTOM SHEET (player picker for tactical board) ---------- */
  // sheetMode = 'pick' (filling empty slot) | 'manage' (slot already has player)
  // | 'replace' (user tapped Replace — pick a swap from any roster player)
  let sheetMode = 'pick';
  let sheetSlot = null;

  function posLabelFull(code) {
    return { G:'Gardien', DEF:'Défenseur', MIL:'Milieu', AT:'Attaquant' }[code] || code;
  }

  window.openSlotSheet = function(slotIdx) {
    sheetSlot = slotIdx;
    const currentId = state.lineupStarters[slotIdx];
    sheetMode = currentId ? 'manage' : 'pick';
    state.pickerSlot = slotIdx;
    renderSheet();
    document.getElementById('sheet-backdrop').classList.add('show');
    document.getElementById('player-sheet').classList.add('show');
    document.getElementById('player-sheet').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  };

  window.closeSheet = function() {
    document.getElementById('sheet-backdrop').classList.remove('show');
    document.getElementById('player-sheet').classList.remove('show');
    document.getElementById('player-sheet').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    sheetSlot = null;
    state.pickerSlot = null;
  };

  function renderSheet() {
    const slotIdx = sheetSlot;
    const slotPositions = buildSlotPositions(state.formation);
    const expectedPos = slotPositions[slotIdx];
    const currentId = state.lineupStarters[slotIdx];
    const currentP = currentId ? BY_ID[currentId] : null;
    const title = document.getElementById('sheet-title');
    const sub = document.getElementById('sheet-sub');
    const actions = document.getElementById('sheet-actions');
    const grid = document.getElementById('sheet-grid');

    if (sheetMode === 'manage' && currentP) {
      title.textContent = `${currentP.firstName} ${currentP.lastName}`;
      sub.textContent = `Poste : ${posLabelFull(expectedPos)} · #${currentP.jerseyDisplay}`;
      actions.style.display = 'grid';
      grid.innerHTML = '<div style="padding:30px 12px; text-align:center; font-size:11px; color:rgba(255,255,255,0.5); font-style:italic;">Choisis une action ci-dessous,<br>ou tape "Remplacer" pour échanger ce joueur.</div>';
    } else {
      title.textContent = sheetMode === 'replace' ? 'Remplacer par...' : 'Choisir joueur';
      sub.textContent = `Poste suggéré : ${posLabelFull(expectedPos)}`;
      actions.style.display = 'none';
      // Sort: players matching expected position first, then others. Inclut les invités.
      const placedIds = new Set(state.lineupStarters.filter(Boolean));
      /* Convocation chargée → seuls les convoqués (les invités passent toujours). */
      const convoked = state.convokedPlayers;
      const pool = convoked && convoked.length
        ? allPlayers().filter((p) => p.isGuest || isConvoked(p))
        : allPlayers();
      if (convoked && convoked.length) {
        sub.textContent = `Poste suggéré : ${posLabelFull(expectedPos)} · Convocation officielle (${convoked.length})`;
      }
      const sorted = pool.sort((a, b) => {
        const aMatch = a.position === expectedPos ? 0 : 1;
        const bMatch = b.position === expectedPos ? 0 : 1;
        if (aMatch !== bMatch) return aMatch - bMatch;
        return a.lastName.localeCompare(b.lastName);
      });
      grid.innerHTML = sorted.map(p => {
        const isPlaced = placedIds.has(p.id);
        const isThisSlot = p.id === currentId;
        const disabled = sheetMode === 'replace' ? isThisSlot : isPlaced;
        const cls = ['player-mini'];
        if (isPlaced && !isThisSlot) cls.push('placed-elsewhere');
        if (disabled) cls.push('disabled');
        if (p.position === expectedPos) cls.push('on');
        if (p.isGuest) cls.push('is-guest');
        return `<div class="${cls.join(' ')}" data-pid="${p.id}" onclick="pickPlayer('${p.id}')">
          <div class="pos-tag">${p.position}</div>
          ${p.isGuest ? '<div class="pguest-tag">INVITÉ</div>' : ''}
          <div class="pimg-wrap">
            ${p.photoUrl ? `<img src="${p.photoUrl}" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.pinit').style.display='flex'">` : ''}
            <div class="pinit" style="${p.photoUrl?'display:none':''}">${playerInitials(p)}</div>
          </div>
          <div class="pjer">${p.jerseyDisplay}</div>
          <div class="pname">${p.lastName}</div>
        </div>`;
      }).join('');
    }
  }

  window.pickPlayer = function(playerId) {
    if (sheetSlot == null) return;
    // If this player is already placed in another slot, vacate that slot first
    const existingIdx = state.lineupStarters.indexOf(playerId);

  /* ---------- MATCH BALL SPONSORS — entreprises offrant le ballon du match ---------- */
  // Auto-derive 2 chars depuis le nom — initiales des 2 premiers mots : 'TECHAUTO AG' -> 'TA',
  // 'BARBEY FRÈRES SA' -> 'BF', 'FC Atlantic' -> 'FA' ; mot unique -> 2 premières lettres.
  // Garde uniquement A-Z0-9 (sans accents).
  function deriveSponsorAbbr(name) {
    const clean = (name || '').toUpperCase()
      .normalize('NFD').replace(/\p{Diacritic}/gu, '') // strip accents
      .replace(/[^A-Z0-9 ]/g, '')
      .trim();
    if (!clean) return '??';
    const words = clean.split(/\s+/).filter(Boolean);
    if (words.length === 1) return words[0].slice(0, 2);
    return (words[0][0] || '') + (words[1][0] || '');
  }

  /* ---------- GOAL TIMELINE actions ----------
     Source de vérité UNIQUE : state.goals. Le score en dérive toujours —
     un ± ou une saisie manuelle crée/retire des buts anonymes (playerId '')
     au lieu de muter le score seul. Le Recap ne peut plus afficher 3-0
     avec un seul buteur listé. */
  function syncScoreFromGoals() {
    state.score.home = state.goals.filter(g => g.side === 'home').length;
    state.score.away = state.goals.filter(g => g.side === 'away').length;
  }
  /* Retire le but le plus récent d'un camp — anonyme d'abord (un but nommé
     saisi par tap buteur ne saute jamais avant les ajustements manuels). */
  function removeLatestGoal(side) {
    const candidates = state.goals.filter(g => g.side === side);
    if (!candidates.length) return false;
    const anon = candidates.filter(g => !g.playerId);
    const target = (anon.length ? anon : candidates).reduce((a, b) => (a.ts > b.ts ? a : b));
    state.goals.splice(state.goals.indexOf(target), 1);
    return true;
  }
  function setScoreCount(side, n) {
    n = Math.max(0, n | 0);
    let count = state.goals.filter(g => g.side === side).length;
    while (count > n && removeLatestGoal(side)) count--;
    while (count < n) { state.goals.push({ minute: state.minute || 0, playerId: '', side, ts: Date.now() + count }); count++; }
    syncScoreFromGoals();
  }
  window.undoGoal = function() {
    if (state.goals.length === 0) return;
    state.goals.pop();
    syncScoreFromGoals();
    toast(`↩ But annulé · ${state.score.home}—${state.score.away}`, 'blue');
    renderPanel(); refresh();
  };
  window.removeGoal = function(ts) {
    const i = state.goals.findIndex(g => g.ts === ts);
    if (i < 0) return;
    const g = state.goals[i];
    state.goals.splice(i, 1);
    syncScoreFromGoals();
    toast(`✕ But ${g.minute}' retiré · ${state.score.home}—${state.score.away}`, 'blue');
    renderPanel(); refresh();
  };

  window.adjustScore = function(side, delta) {
    if (delta > 0) state.goals.push({ minute: state.minute || 0, playerId: '', side, ts: Date.now() });
    else removeLatestGoal(side);
    syncScoreFromGoals();
    renderPanel();
    refresh();
  };
  window.setScorerSide = function(side) {
    // Just switch the toggle UI — actual goal logging happens on player click
    // (home) or via the "+ But adverse" button (away).
    state.scorerSide = side;
    renderPanel(); refresh();
  };
  window.logAwayGoal = function() {
    state.goals.push({ minute: state.minute || 0, playerId: '', side: 'away', ts: Date.now() });
    syncScoreFromGoals();
    toast(`😐 ${state.minute || 0}' · But encaissé · ${state.score.home}—${state.score.away}`, 'red');
    renderPanel(); refresh();
  };
  window.resetCaptionField = function(field) {
    if (state.captionOverride[state.variant]) {
      delete state.captionOverride[state.variant][field];
      if (Object.keys(state.captionOverride[state.variant]).length === 0) {
        delete state.captionOverride[state.variant];
      }
    }
    renderPanel();
    toast(`↺ ${field === 'hook' ? 'Titre' : field === 'body' ? 'Message' : 'Hashtags'} réinitialisé`);
  };

  /* ---------- Persistance locale ----------
     Sur iOS, une PWA standalone est tuée en arrière-plan en quelques
     minutes : perdre score/buteurs/compo en plein match était le scénario
     NOMINAL. Chaque mutation persiste l'état du match courant (clé par
     match, TTL 12 h) ; init() restaure avant toute auto-sélection. */
  const LIVE_KEY_PREFIX = 'fca-mc:v1:live:';
  const LAST_KEY = 'fca-mc:v1:last';
  const LIVE_TTL_MS = 12 * 3600 * 1000;
  const PERSIST_FIELDS = ['variant','format','homeAway','competition','convokedPlayers',
    'competitionSub','matchId','_userPickedMatch','opponentSlug','matchNumber','venue','venueCity',
    'kickoff','matchBallSponsors','score','minute','scorerId','scorerSide','formation','captainId',
    'lineupStarters','lineupBench','guests','goals','customMessage','captionOverride'];
  function liveKey() {
    return LIVE_KEY_PREFIX + (state.matchId || (state.opponentSlug + '|' + state.kickoff.dateLabel));
  }
  function persistLive() {
    try {
      const snap = { ts: Date.now() };
      PERSIST_FIELDS.forEach(k => { snap[k] = state[k]; });
      const key = liveKey();
      localStorage.setItem(key, JSON.stringify(snap));
      localStorage.setItem(LAST_KEY, key);
    } catch (e) { /* stockage plein / navigation privée — l'app reste fonctionnelle */ }
  }
  function readSnap(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const snap = JSON.parse(raw);
      if (!snap || !snap.ts || Date.now() - snap.ts > LIVE_TTL_MS) return null;
      return snap;
    } catch (e) { return null; }
  }
  function applySnap(snap) {
    PERSIST_FIELDS.forEach(k => { if (snap[k] !== undefined) state[k] = snap[k]; });
    syncScoreFromGoals();
  }
  /* Reprise au démarrage : dernier match travaillé, snapshot < 12 h. */
  function restoreLive() {
    try {
      const key = localStorage.getItem(LAST_KEY);
      if (!key) return false;
      const snap = readSnap(key);
      if (!snap) return false;
      applySnap(snap);
      return true;
    } catch (e) { return false; }
  }
  function resetLiveFields() {
    state.score = { home: 0, away: 0 };
    state.minute = 0;
    state.scorerId = '';
    state.scorerSide = 'home';
    state.goals = [];
    state.lineupStarters = ['','','','','','','','','','',''];
    state.lineupBench = [];
  }

  function refresh() { ensureSponsorLogos(); updatePreview(); updateAppbar(); persistLive(); }
  function renderAll() { renderSectionTabs(); renderPanel(); refresh(); }

  function toast(msg, kind='') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + kind;
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => t.classList.remove('show'), 1800);
  }

  window.setFormat = function(fmt) {
    if (fmt !== 'story' && fmt !== 'post') return;
    state.format = fmt;
    // Update toggle UI
    document.querySelectorAll('#format-toggle .ft-btn').forEach(b => {
      b.classList.toggle('on', b.dataset.fmt === fmt);
    });

  };

  /* ---------- PNG GENERATION (v11 — bug-fix: force data URL hydration) ----------
     Bug fixed: external image URLs (logos d'opposants, photos joueurs) ne sont
     pas toujours chargées au moment du clone html2canvas, ce qui décalait les
     logos et les photos dans le PNG final. Fix: on hydrate TOUS les <img> en
     data URLs AVANT la capture, et on attend leur naturalWidth > 0.
  */
  async function renderFullRes() {
    // Format effectif : la variante lineup force le 9:16 (story) même si le toggle est sur post,
    // car le poster lineup est trop dense pour le 4:5. Cf. posterHTML L1231 et updatePreview L1257.
    // Sans ça, l'export PNG était silencieusement croppé à 1080x1350 en perdant le banc + le footer.
    const effectiveFormat = (state.variant === 'lineup') ? 'story' : state.format;
    const f = FORMATS[effectiveFormat] || FORMATS.story;

    // STEP 0 — Rasterize the FCA SVG crest to PNG for reliable html2canvas export
    await ensureAtlCrestPng();
    // STEP 1 — Make sure all external assets are pre-cached as data URLs
    await preloadAllAssets();

    // STEP 2 — Build offscreen DOM (full-res)
    const off = document.createElement('div');
    off.style.cssText = `position:fixed; left:-99999px; top:0; width:${f.w}px; height:${f.h}px; z-index:-1;`;
    off.innerHTML = posterHTML();
    document.body.appendChild(off);

    // STEP 3 — Rewrite every <img> src to its cached data URL (fail-safe).
    // On track aussi les <img> dont l'URL externe n'a PAS pu être remplacée par
    // un dataURL caché : ces images vont taint le canvas et faire échouer le
    // toBlob (CORS). On les signale au lieu de produire un PNG silencieusement cassé.
    const imgs = off.querySelectorAll('img');
    const untaintable = [];
    imgs.forEach(img => {
      const src = img.getAttribute('src') || '';
      if (src.startsWith('data:')) return; // already a data URL
      // Match against PHOTO_CACHE (player photos)
      if (PHOTO_CACHE[src]) { img.src = PHOTO_CACHE[src]; return; }
      // Match against CREST_CACHE (opponent logos by URL)
      const oppMatch = OPPONENTS.find(o => o.crestUrl === src);
      if (oppMatch && CREST_CACHE[oppMatch.slug]) { img.src = CREST_CACHE[oppMatch.slug]; return; }
      // Sinon : URL externe non-cachée -> risque de taint canvas.
      untaintable.push(src);
    });
    if (untaintable.length > 0) {
      console.warn('[FCA] %d <img> sans dataURL caché (risque CORS taint) :', untaintable.length, untaintable);
    }

    // STEP 4 — Wait for ALL images in the offscreen tree to be fully loaded.
    // On compte les images qui ont raté (error event ou timeout) — ces images
    // vont rendre une icône cassée dans le PNG final, il faut le signaler.
    let imageFailures = 0;
    await Promise.all([...imgs].map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(res => {
        let settled = false;
        const ok = () => { if (settled) return; settled = true; res(); };
        const fail = (reason) => { if (settled) return; settled = true; imageFailures++; console.warn('[FCA] img load failed (%s) :', reason, (img.src || '').slice(0, 100)); res(); };
        img.addEventListener('load', ok, { once: true });
        img.addEventListener('error', () => fail('error'), { once: true });
        setTimeout(() => fail('timeout-4s'), 4000);
      });
    }));

    // STEP 5 — Wait for fonts
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    // STEP 5b — Decode every <img> so html2canvas sees fully-rasterized bitmaps.
    // Si decode() échoue, on compte aussi : le bitmap sera partiel ou vide.
    let decodeFailures = 0;
    await Promise.all([...imgs].map(img => {
      if (typeof img.decode !== 'function') return Promise.resolve();
      return img.decode().catch(err => {
        decodeFailures++;
        console.warn('[FCA] img.decode failed :', (img.src || '').slice(0, 100), err && err.message);
      });
    }));

    // Si trop d'images cassées, on signale à l'utilisateur AVANT de capturer
    // (le toast warning sera visible quelques secondes pendant le rendu).
    const totalFailures = imageFailures + decodeFailures + untaintable.length;
    if (totalFailures > 0 && typeof toast === 'function') {
      toast(`⚠ ${totalFailures} image(s) non chargée(s) — vérifie le PNG`, 'red');
    }

    // STEP 6 — Layout settle delay (forces browser to compute final styles)
    await new Promise(r => setTimeout(r, 350));

    // STEP 7 — Capture
    const canvas = await html2canvas(off.querySelector('#poster-node'), {
      width: f.w, height: f.h, scale:1, backgroundColor:null,
      useCORS:true, allowTaint:false, logging:false, imageTimeout:12000,
    });
    document.body.removeChild(off);
    return canvas;
  }
  /* Detect iOS (iPhone, iPad including iPadOS-Safari-as-desktop) — used to
     pick the export path. iOS Safari does not honor <a download> as a true
     download; opening the blob in a new tab gives the user the long-press
     "Save to Photos" gesture, which is what we actually want for stories. */
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  async function buildPosterBlob() {
    const canvas = await renderFullRes();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png', 0.95));
    // canvas.toBlob renvoie null si le canvas est tainté (CORS) ou si l'encoder
    // échoue. Sans ce check on appellerait URL.createObjectURL(null) plus loin
    // et le user verrait juste "❌ Erreur PNG" sans diagnostic utilisable.
    if (!blob) {
      throw new Error('canvas.toBlob a renvoyé null — canvas probablement tainté (image externe non chargée en dataURL). Vérifier la console pour la liste.');
    }
    console.info(`[FCA] Poster exported: ${canvas.width}×${canvas.height}px · ${(blob.size/1024).toFixed(0)} KB · ${state.format}/${state.variant}`);
    return { canvas, blob };
  }

  function posterFileName() {
    const date = (state.kickoff.dateLabel || '').replace(/\s+/g, '-').toLowerCase();
    const prefix = (TENANT_CONFIG.club.abbr || 'POSTER').toUpperCase();
    return `${prefix}_${state.variant}_${date}_${state.format}.png`;
  }

  async function downloadPoster() {
    const btn = document.getElementById('download-btn');
    const lbl = document.getElementById('download-label');
    btn.disabled = true;
    lbl.innerHTML = '<span class="spinner"></span>';
    try {
      const { blob } = await buildPosterBlob();
      const url = URL.createObjectURL(blob);
      const fileName = posterFileName();
      if (isIOS()) {
        // iOS: open in new tab so user can long-press → Save to Photos.
        // <a download> on iOS Safari triggers a viewer that hides the image.
        const win = window.open(url, '_blank');
        if (win) {
          toast('📷 Long-press l\'image → Enregistrer');
        } else {
          // Popup blocked (rare) — fall back to classic download.
          const a = document.createElement('a');
          a.href = url; a.download = fileName;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          toast('✅ PNG ouvert');
        }
      } else {
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        toast('✅ PNG téléchargé');
      }
      // Delay revoke so the new tab has time to load the blob
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) {
      console.error('[FCA] downloadPoster failed :', e);
      const msg = (e && e.message) ? e.message.slice(0, 80) : 'Erreur inconnue';
      toast(`❌ ${msg}`, 'red');
    }
    finally { btn.disabled = false; lbl.textContent = 'PNG'; }
  }

  async function sharePoster() {
    const btn = document.querySelector('.btn-ghost');
    const original = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
    try {
      const { blob } = await buildPosterBlob();
      const file = new File([blob], posterFileName(), { type:'image/png' });
      // Path 1 — native share with file ONLY. iOS sometimes fails silently
      // when title+text are present alongside a file; we keep it minimal.
      if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })) {
        try {
          await navigator.share({ files:[file] });
          toast('✅ Partagé');
          return;
        } catch (shareErr) {
          // User cancelled the share sheet — that's fine, no fallback.
          if (shareErr && shareErr.name === 'AbortError') { return; }
          console.warn('[FCA] navigator.share failed, falling back to open-in-tab', shareErr);
          // Fall through to Path 2.
        }
      }
      // Path 2 — open blob in a new tab so user can long-press to save.
      // Works everywhere (iOS Safari, Android Chrome, desktop browsers).
      const url = URL.createObjectURL(blob);
      const win = window.open(url, '_blank');
      if (win) {
        toast(isIOS() ? '📷 Long-press → Enregistrer' : '✅ Ouvert dans un onglet');
      } else {
        // Popup blocked — last resort: classic download.
        const a = document.createElement('a');
        a.href = url; a.download = posterFileName();
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        toast('✅ Téléchargé');
      }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) {
      console.error('[FCA] sharePoster failed :', e);
      const msg = (e && e.message) ? e.message.slice(0, 80) : 'Erreur inconnue';
      toast(`❌ ${msg}`, 'red');
    }
    finally { if (btn) { btn.disabled = false; btn.innerHTML = original; } }
  }
  async function copyCaption() {
    try { await navigator.clipboard.writeText(captionToString()); toast('✅ Caption copiée'); }
    catch (e) { toast('❌ Copie impossible','red'); }
  }
  window.downloadPoster = downloadPoster;
  window.sharePoster = sharePoster;
  window.copyCaption = copyCaption;

  /* ---------- INIT -------------------------------------------- */
  let _initRan = false;
  /* ── Bundle API (chantier 26/27) ──────────────────────────────
     Le site est la source de vérité : une requête charge TOUTE la saison
     (matchs + heures « à confirmer », convocations par match, parrains
     ballon publiés, roster actif). Le bundle est caché en localStorage —
     offline, la PWA repart du dernier bundle connu ; sans aucun cache,
     les tables hardcodées MATCHES/OPPONENTS/ROSTER restent le seed. */
  const BUNDLE_API = 'https://fc-atlantic-vevey.ch/api/match-controller/bundle';
  const BUNDLE_KEY = 'fca-mc:v1:bundle';
  const POS_MAP = { GK: 'G', DEF: 'DEF', MID: 'MIL', FWD: 'AT' };
  let BUNDLE = null;   // dernier bundle appliqué (réseau ou cache)

  /* Parrains ballon publiés pour un match — pré-remplis, éditables ensuite. */
  function ballSponsorsFor(matchId) {
    const list = BUNDLE && BUNDLE.matchBallSponsors && BUNDLE.matchBallSponsors[matchId];
    if (!list || !list.length) return [];
    return list.map(s => ({ name: s.companyName, abbr: deriveSponsorAbbr(s.companyName), logoUrl: s.logoUrl || null }));
  }
  /* Convocation coach du match — la convocation colle au match SÉLECTIONNÉ,
     plus jamais celle du « prochain match » collée sur un autre. */
  function convocationFor(matchId) {
    const c = BUNDLE && BUNDLE.convocations && BUNDLE.convocations[matchId];
    if (!c || !c.players || !c.players.length) return null;
    return c.players.map(p => ({ jersey: p.jersey, firstName: p.firstName || '',
      lastName: p.lastName || '', position: POS_MAP[p.position] || p.position || '' }));
  }

  function applyBundleData(data) {
    if (!data || !Array.isArray(data.matches) || !data.matches.length) return false;
    BUNDLE = data;
    /* OPPONENTS — noms officiels du site (désambiguïsés « FC Vignoble II ») ;
       shortName/abbr curés conservés ; inconnus ajoutés, dédup par slug. */
    data.matches.forEach(m => {
      const o = m.opponent || {};
      if (!o.slug) return;
      const existing = OPPONENTS.find(x => x.slug === o.slug);
      if (existing) {
        if (o.name) existing.name = o.name;
        if (!existing.crestUrl && o.crestUrl) existing.crestUrl = o.crestUrl;
      } else {
        OPPONENTS.push({ slug: o.slug, name: o.name || 'Adversaire',
          shortName: (o.shortName || o.name || '').toUpperCase().slice(0, 14) || 'ADV',
          abbr: (o.shortName || o.name || '').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 3) || 'OPP',
          crestUrl: o.crestUrl || '' });
      }
    });
    /* MATCHES — projection du bundle (la DB gagne, y c. heures TBD 00228).
       matchday n'est pas rempli par la sync ACVF → J1..J22 par ordre
       chronologique (le bundle porte la saison entière, triée asc). */
    let am = 0, jn = 0;
    const useOrdinal = data.matches.some(m => m.competition === 'championnat' && !m.matchday);
    const projected = data.matches
      .filter(m => m.status !== 'cancelled' && m.opponent && m.opponent.slug)
      .map(m => ({
        id: m.id,
        comp: m.competition,
        label: m.competition === 'championnat' ? 'J' + (useOrdinal ? ++jn : m.matchday)
             : m.competition === 'amical' ? 'AM' + (++am) : 'COUPE',
        competitionSub: m.competitionSub || undefined,
        opponentSlug: m.opponent.slug,
        homeAway: m.homeAway === 'away' ? 'away' : 'home',
        matchNumber: m.matchNumber || '',
        venue: m.homeAway === 'home' ? '' : (m.venueName || ''),
        venueCity: m.homeAway === 'home' ? '' : (m.venueCity || '').toUpperCase(),
        kickoff: { dayName: m.kickoff.dayName, dateLabel: m.kickoff.dateLabel, year: m.kickoff.year,
                   time: m.kickoff.time, iso: m.kickoff.iso, timeTbd: !!m.kickoff.timeTbd },
        timeProvisional: !!m.kickoff.timeTbd,
        status: m.status,
        siteScore: m.score || null,
      }));
    MATCHES.length = 0;
    Array.prototype.push.apply(MATCHES, projected);
    /* ROSTER — rafraîchi par identité (numéro + nom) ; recrues inconnues
       ajoutées. Position écrasée seulement si le site en donne une valide. */
    (data.roster || []).forEach(r => {
      const pos = POS_MAP[r.position];
      const hit = ROSTER.find(p => !p.isGuest && p.jerseyDisplay === r.jersey && normName(p.lastName) === normName(r.lastName));
      if (hit) {
        if (r.firstName) hit.firstName = r.firstName;
        if (r.photoUrl) hit.photoUrl = r.photoUrl;
        if (pos) hit.position = pos;
      } else if (r.jersey != null) {
        const id = 'api-' + r.jersey + '-' + normName(r.lastName).slice(0, 8);
        if (!ROSTER.some(p => p.id === id)) {
          const entry = { id, jerseyDisplay: r.jersey, firstName: r.firstName || '',
            lastName: r.lastName || '', position: pos || 'MIL', photoUrl: r.photoUrl || '' };
          ROSTER.push(entry);
          BY_ID[id] = entry;
        }
      }
    });
    return true;
  }

  function applyCachedBundle() {
    try {
      const raw = localStorage.getItem(BUNDLE_KEY);
      if (!raw) return false;
      const cached = JSON.parse(raw);
      return applyBundleData(cached && cached.data);
    } catch (e) { return false; }
  }

  async function loadBundle(restored) {
    let data = null;
    try {
      /* PAS de ?ts ni no-store : le CDN (s-maxage 120 s) sert enfin des HIT. */
      const res = await fetch(BUNDLE_API);
      if (res.ok) {
        data = await res.json();
        try { localStorage.setItem(BUNDLE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
      }
    } catch (e) { /* offline → le cache appliqué par init() fait foi */ }
    if (!data || !applyBundleData(data)) return;
    if (!restored && !state._userPickedMatch) {
      applyMatchFields(nextUpcomingMatch());
    } else if (state.matchId) {
      /* État repris ou match choisi : on ne touche qu'aux données annexes. */
      state.convokedPlayers = convocationFor(state.matchId) || state.convokedPlayers;
      if (!state.matchBallSponsors.length) state.matchBallSponsors = ballSponsorsFor(state.matchId);
    }
    ensureCrest(getOpp());
    /* Nouvelles photos/crests éventuels (recrues, logos à jour) → re-preload. */
    invalidatePreloadCache();
    preloadAllAssets().then(() => refresh());
    renderAll();
  }

  async function init() {
    if (_initRan) return;
    _initRan = true;
    applyCachedBundle();            // saison depuis le dernier bundle connu (offline-first)
    const restored = restoreLive(); // reprise d'un match en cours (< 12 h) — AVANT toute auto-sélection
    if (!restored && !state._userPickedMatch && !state.matchId) applyMatchFields(nextUpcomingMatch());
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e) {} }
    renderAll();
    loadBundle(restored); // non-bloquant · rafraîchit saison + convocations + parrains
    // Rasterize SVG crest + preload external assets in parallel, then re-render.
    Promise.all([ensureAtlCrestPng(), preloadAllAssets()]).then(() => refresh());
  }
  /* Poignée de debug/E2E (lecture seule par convention — rien dans l'app ne
     passe par elle). Permet aux tests Playwright d'observer l'état réel. */
  window.__mc = { state, MATCHES, OPPONENTS, ROSTER, buildPosterBlob };
  window.addEventListener('load', init);
  window.addEventListener('resize', () => updatePreview());
  /* iOS tue la PWA en arrière-plan sans prévenir — on persiste au moment
     où elle passe en fond, pas seulement à la dernière mutation. */
  window.addEventListener('pagehide', persistLive);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') persistLive();
  });
  init();
  </script>
</body>
</html>
